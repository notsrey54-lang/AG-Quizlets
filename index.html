            {id: 93, q: "هل تتوفر شبكة 5G-advance في جميع مناطق الكويت؟", a: "لا"}
        ];

        function renderCards(items) {
            const container = document.getElementById('results-container');
            const countBadge = document.getElementById('count-badge');
            const emptyState = document.getElementById('empty-state');
            
            if (!container) return;

            container.innerHTML = '';
            
            if (items.length === 0) {
                container.classList.add('hidden');
                if (emptyState) {
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                }
            } else {
                container.classList.remove('hidden');
                if (emptyState) {
                    emptyState.classList.add('hidden');
                    emptyState.classList.remove('flex');
                }
            }

            if (countBadge) {
                countBadge.textContent = items.length;
            }

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'q-card bg-white rounded-2xl p-6 border border-slate-100 flex flex-col justify-between h-full relative overflow-hidden group shadow-sm';
                
                card.innerHTML = `
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <span class="inline-flex items-center justify-center px-2.5 py-1 rounded-lg text-xs font-bold text-stc-purple bg-purple-50 group-hover:bg-stc-purple group-hover:text-white transition-colors">
                                <i class="fa-solid fa-hashtag ml-1"></i> ${item.id}
                            </span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-6 leading-relaxed">${item.q}</h3>
                    </div>
                    
                    <div class="relative z-10 mt-auto pt-4 border-t border-dashed border-slate-200">
                        <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold mb-2">الإجابة المعتمدة</div>
                        <div class="bg-gradient-to-br from-slate-50 to-slate-100 p-3 rounded-xl border border-slate-100 text-stc-purple font-bold text-lg shadow-sm group-hover:from-purple-50 group-hover:to-white group-hover:border-purple-100 transition-all">
                            ${item.a}
                        </div>
                    </div>
                    
                    <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-gradient-to-tr from-stc-orange to-stc-purple opacity-5 rounded-full group-hover:scale-150 transition-transform duration-500 ease-out z-0"></div>
                `;
                container.appendChild(card);
            500 ease-out z-0"></div>
                `;
                container.appendChild(card);
            });
        }

        function initApp() {
            renderCards(quizData);

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    const filtered = quizData.filter(item => 
                        item.q.toLowerCase().includes(query) || 
                        item.a.toLowerCase().includes(query) ||
                        item.id.toString().includes(query)
                    );
                    renderCards(filtered);
                });
            }

            const versionTag = document.getElementById('version-tagline');
            if (versionTag) {
                const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
                const now = new Date();
                versionTag.textContent = `نسخة ${months[now.getMonth()]} ${now.getFullYear()}`;
            }
        }

        function downloadApp() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], {type: 'text/html;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'AG_Quizlet_App.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
