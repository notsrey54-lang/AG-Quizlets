<meta charset="UTF-8">

<!-- Luxury color overrides -->
    <style>
      /* Override STC palette with luxury colors */
      .text-stc-purple { color: #D4AF37 !important; }
      .bg-stc-purple { background-color: #0A0E23 !important; }
      .from-stc-purple { --tw-gradient-from: #0A0E23 !important; }
      .to-stc-light { --tw-gradient-to: #162345 !important; }
      .from-stc-light { --tw-gradient-from: #162345 !important; }
      .to-stc-purple { --tw-gradient-to: #D4AF37 !important; }
      .border-stc-purple { border-color: #D4AF37 !important; }
      /* Card hover: golden shadow and border */
      .q-card:hover { box-shadow: 0 10px 20px -3px rgba(212, 175, 55, 0.25) !important; border-color: #D4AF37 !important; }
      /* Replace light purple backgrounds with cream tone for tags */
      .bg-purple-50 { background-color: #f5f0e8 !important; }
    </style>

    <style>
        body {
            background-color: #f8fafc;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Card Hover Effects */
        .q-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .q-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px -3px rgba(79, 0, 140, 0.15); /* Purple shadow */
            border-color: #4F008C;
        }
        
        /* Smooth fade in */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>

                fragment.appendChild(card);
            });
            container.appendChild(fragment);
        }

        function updateVersionTagline() {
            const versionTag = document.getElementById('version-tagline');
            if (!versionTag) {
                return;
            }
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            const now = new Date();
            versionTag.textContent = 'نسخة ' + months[now.getMonth()] + ' ' + now.getFullYear();
        }

        function downloadApp() {
            const copy = document.documentElement.cloneNode(true);
            const copyResults = copy.querySelector('#results-container');
            const copySearch = copy.querySelector('#searchInput');
            const copyBadge = copy.querySelector('#count-badge');
            const copyEmptyState = copy.querySelector('#empty-state');

            if (copyResults) {
                copyResults.textContent = '';
                copyResults.classList.remove('hidden');
            }
            if (copySearch) {
                copySearch.value = '';
            }
            if (copyBadge) {
                copyBadge.textContent = String(quizData.length);
            }
            if (copyEmptyState) {
                copyEmptyState.classList.add('hidden');
                copyEmptyState.classList.remove('flex');
            }

            const htmlContent = '<!doctype html>\n' + copy.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'AG_Quizlet_App.html';
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 0);
        }

        function initialiseApp() {
            if (!container || !searchInput || !countBadge || !emptyState) {
                throw new Error('Required application elements are missing.');
            }
            renderCards(quizData);
            updateVersionTagline();
            searchInput.addEventListener('input', event => {
                const query = normaliseSearch(event.target.value.trim());
                const filtered = quizData.filter(item => {
                    const searchable = [item.id, item.q, item.a].map(normaliseSearch);
                    return searchable.some(value => value.includes(query));
                });
                renderCards(filtered);
            });
            downloadButton?.addEventListener('click', downloadApp);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialiseApp, { once: true });
        } else {
            initialiseApp();
        }
    </script>
</body>
</html>
